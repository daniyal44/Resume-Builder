name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint & build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check & build
        run: npm run build

      - name: Verify crawlable static pages shipped
        run: |
          for f in dist/index.html dist/templates/index.html \
                   dist/guides/ats-resume/index.html \
                   dist/guides/how-to-write-a-resume/index.html \
                   dist/guides/resume-format/index.html \
                   dist/robots.txt dist/sitemap.xml dist/llms.txt; do
            test -f "$f" || { echo "missing: $f"; exit 1; }
          done
          echo "All crawlable pages and SEO files are present."
